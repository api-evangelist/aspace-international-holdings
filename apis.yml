aid: aspace-international-holdings
name: ASPACE International Holdings
description: 'ASPACE International Holdings is a commercial space company founded in
  2015 with offices listed in Dubai, United Arab Emirates and Hong Kong, China. It
  positions itself as an aerospace manufacturing conglomerate centred on the Abu Dhabi
  Space Eco City — a three-million-square-metre industrial cluster it says will bring
  together more than 3,000 partner companies across satellite manufacturing, space
  trade and aerospace technology innovation. The ASPACE brand is shared with Hong Kong-listed
  USPACE Technology Group, whose satellite-manufacturing subsidiary was renamed Aspace
  Satellite Technology Limited in 2023. ASPACE International Holdings has taken investment
  from Alpha MBM Investments and makes minority investments of its own, including a
  stake in the private-equity trading platform Cubin LLC announced in 2023. It is a
  hardware, industrial-development and investment holding business rather than a software
  vendor: no first-party corporate domain for the company resolves, its only verified
  public surfaces are a LinkedIn company page, a Hiive secondary-market listing and
  third-party investor databases, and it publishes no developer program, API, SDK or
  machine-readable specification of any kind.'
